name: Update exchange log

on:
  push:
    branches:
      - claude-main
    paths:
      - ".claude/skills/**"

permissions:
  contents: write

concurrency:
  group: exchange-log-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-exchange-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: claude-main
          fetch-depth: 0

      - name: Update the exchange log
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: python3 .github/scripts/update_exchange_log.py

      - name: Commit and push the log entry
        run: |
          if git diff --quiet -- .AI_agent/exchange_log.md; then
            echo "No exchange-log update was needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .AI_agent/exchange_log.md
          git commit -m "docs(log): record skill update [skip ci]"
          git pull --rebase origin claude-main
          git push origin HEAD:claude-main
