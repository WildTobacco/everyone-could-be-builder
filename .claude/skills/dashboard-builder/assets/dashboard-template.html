<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{DASHBOARD_NAME}} — BIDV Dashboard</title>
<style>
  :root {
    --background:        #f5f3ef;
    --foreground:         #1a1c18;
    --card:                #fefdfb;
    --card-foreground:    #1a1c18;
    --muted:              #ece9e3;
    --muted-foreground:   #5c5a54;
    --border:             #ddd9d3;
    --primary:            #0d5d56;
    --primary-foreground: #ffffff;
    --up:                 #0d8a5f;
    --down:               #c0392b;
    --ribbon-teal:        #006d68;
    --ribbon-teal-text:   #ffc72c;
    --ribbon-gold:        #ffc72c;
    --ribbon-gold-text:   #006d68;
    --series-grey:        #a8a6a0; /* lighter grey for the SNH bar series */
    --chart-teal:         #0d5d56;
    --chart-yellow:       #ffc72c;
    --chart-grey:         #a8a6a0;
    --chart-column-radius: 6px;
    --radius: 0.5rem;
  }
  .dark {
    --background:        #0b1413;
    --foreground:         #e6efed;
    --card:                #111c1a;
    --card-foreground:    #e6efed;
    --muted:              #1a2725;
    --muted-foreground:   #8aa39e;
    --border:             #223330;
    --primary:            #36a695;
    --primary-foreground: #06211e;
    --up:                 #34d399;
    --down:               #f87171;
    --ribbon-teal:        #0a3d3a;
    --ribbon-teal-text:   #d9a93a;
    --ribbon-gold:        #a8791f;
    --ribbon-gold-text:   #0e2a27;
    --series-grey:        #9aa9a5;
    --chart-teal:         #36a695;
    --chart-yellow:       #d9a93a;
    --chart-grey:         #9aa9a5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--background);
    color: var(--foreground);
    padding: 20px;
  }
  .mock-banner {
    max-width: none;
    margin: 0 auto 14px;
    font-size: 12px;
    color: var(--muted-foreground);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mock-banner .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ribbon-gold); }

  .app {
    max-width: none;
    margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  header.topbar {
    background: var(--ribbon-teal);
    color: #fff;
    padding: 18px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header.topbar .titles h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    color: rgba(255,255,255,0.92);
  }
  header.topbar .titles h2 {
    margin: 2px 0 0;
    font-size: 22px;
    font-weight: 800;
    color: var(--ribbon-teal-text);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  header.topbar .date-badge {
    display: inline-block;
    margin-top: 8px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: var(--radius);
    padding: 6px 16px;
    font-weight: 700;
    font-size: 14px;
    color: rgba(255,255,255,0.92);
    font-variant-numeric: tabular-nums;
  }
  header.topbar .brand {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
  }
  header.topbar .brand .mark {
    height: 30px; width: auto;
    aspect-ratio: 276 / 314; /* exact aspect of the source BIDV mark crop */
    display: inline-block;
  }
  header.topbar .brand .mark img { width: 100%; height: 100%; display: block; object-fit: contain; }

  main.dashboard {
    background: var(--background);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px; /* --section-gap */
  }

  .dashboard-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
    gap: 14px;
  }
  @media (max-width: 980px) {
    .dashboard-row { grid-template-columns: 1fr; }
  }

  .col { display: flex; flex-direction: column; gap: 14px; }
  .dashboard-row .col { height: 100%; }
  .dashboard-row .col > .card {
    flex: 1;
    height: 100%;
    min-height: 360px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  .card {
    background: var(--card);
    color: var(--card-foreground);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    padding: 16px;
  }

  /* ---------- scorecards — the real .kpi-card component from web_app.py ---------- */
  .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    padding: 14px 14px;
    flex: 1;
    min-width: 220px;
    position: relative;
    overflow: hidden;
  }
  /* signature motif: every kpi-card in the real app carries this teal->gold->transparent top line */
  .kpi-card::before {
    content: "";
    position: absolute; top: -1px; left: -1px; right: -1px; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--ribbon-gold) 65%, transparent);
  }
  .kpi-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--primary);
    text-align: center;
    margin: 0 0 12px 0;
  }
  .kpi-row-inner { display: flex; align-items: center; gap: 12px; }
  .kpi-metric { flex: 1; min-width: 0; text-align: center; }
  .kpi-divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 12px; }
  .kpi-big {
    font-size: 24px;
    font-weight: 800;
    color: var(--foreground);
    white-space: nowrap;
    overflow-wrap: break-word;
    font-variant-numeric: tabular-nums;
  }
  .kpi-big.pos { color: var(--up); }
  .kpi-big.neg { color: var(--down); }
  .kpi-sub {
    font-size: 14px; color: var(--muted-foreground); margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-footer {
    display: flex; justify-content: center; gap: 16px;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 14px; color: var(--muted-foreground);
  }
  .kpi-footer b { color: var(--card-foreground); font-variant-numeric: tabular-nums; }
  .kpi-footer b.pos { color: var(--up); }
  .kpi-footer b.neg { color: var(--down); }

  .export-btn {
    font: inherit; font-size: 13px; font-weight: 700;
    color: var(--primary-foreground); background: var(--primary);
    border: none; border-radius: var(--radius);
    padding: 8px 16px; cursor: pointer;
  }
  .export-btn:hover { opacity: 0.9; }
  .export-btn:disabled { opacity: 0.6; cursor: default; }

  .chart-select {
    font: inherit; font-size: 13px; color: var(--card-foreground);
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px 10px; cursor: pointer;
  }

  /* ---------- chart card ---------- */
  .chart-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .chart-card h3, .chart-card-head h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }

  .legend { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--muted-foreground); margin-top: 12px; flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* chart body fills whatever height the (now height-unified) card has */
  #grouped-view, #product-view, #mang-product-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #grouped-chart, #product-chart, #mang-product-chart { flex: 1; min-height: 0; }
  #grouped-chart svg, #product-chart svg, #mang-product-chart svg { width: 100%; height: 100%; display: block; }

  .qmt-chart { height: 300px; }
  .qmt-chart svg { width: 100%; height: 100%; display: block; }
  .qmt-row { display: flex; gap: 16px; }
  .qmt-row .qmt-col { flex: 1; min-width: 0; }
  .qmt-col-title { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted-foreground); margin-bottom: 6px; }
  .qmt-note { font-size: 12px; color: var(--muted-foreground); margin-top: 8px; font-style: italic; }

  svg text { font-family: system-ui, sans-serif; }
  .axis-label { font-size: 12px; fill: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .baseline { stroke: var(--border); stroke-width: 1; }
  .bar-label { font-size: 12px; fill: var(--card-foreground); font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { cursor: pointer; }
  #product-chart .bar { cursor: default; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--foreground);
    color: var(--background);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: var(--radius);
    z-index: 50;
    opacity: 0;
    transform: translate(-50%, -120%);
    transition: opacity 0.08s ease;
    white-space: pre-line;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .tooltip.show { opacity: 1; }

  /* ---------- tabs ---------- */
  .tab-bar {
    display: flex; gap: 4px;
    padding: 0 16px;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted-foreground);
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 12px 16px 10px;
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--primary); }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-panel { display: flex; flex-direction: column; gap: 14px; }

  /* mảng hoạt động selector — folder tabs structurally attached to the panel below them.
     The active tab shares the panel's exact background and its bottom border is painted in
     that same color, so it visually erases the seam and reads as one continuous surface. */
  .folder-tabs { display: flex; gap: 6px; position: relative; z-index: 1; }
  .folder-tab {
    font: inherit; font-size: 13px; font-weight: 700;
    color: var(--muted-foreground);
    background: var(--muted);
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
    padding: 10px 20px 9px;
    cursor: pointer;
  }
  .folder-tab:hover { color: var(--primary); }
  .folder-tab.active {
    background: var(--card);
    color: var(--primary);
    border-color: var(--border);
    border-bottom-color: var(--card); /* matches the panel's own background — erases the seam */
    position: relative;
  }
  .folder-panel {
    margin-top: -15px; /* cancel .tab-panel's flex gap so tabs sit flush on the panel */
    position: relative; z-index: 0;
    background: var(--card);
    color: var(--card-foreground);
    border: 1px solid var(--border);
    border-radius: 0 14px 14px 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    padding: 20px;
  }
  .perf-filter-row { display: flex; gap: 8px; margin: 4px 0 12px; }
  .folder-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

  /* Ngày / Tháng / Năm — a lighter-weight toggle nested inside the folder panel's own header */
  #perf-view-pills { display: flex; gap: 6px; }
  .perf-pill {
    font: inherit; font-size: 12px; font-weight: 700;
    color: var(--muted-foreground); background: var(--muted);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 12px; cursor: pointer;
  }
  .perf-pill:hover { color: var(--primary); }
  .perf-pill.active { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }

  /* KQKD trend / performance chart */
  .trend-chart svg { width: 100%; height: 100%; display: block; }
  #khkd-chart svg { width: 100%; height: 100%; display: block; }
  .chart-note { font-size: 12px; color: var(--muted-foreground); font-style: italic; margin-top: 8px; }

  /* the stacked chart no longer sits in a stretchy flex column (its old dedicated .card is
     gone, folded into .folder-panel instead), so give it an explicit height directly */
  #mang-product-chart { height: 360px; }

  .line-path { fill: none; stroke: var(--primary); stroke-width: 2; }
  .area-fill { fill: var(--primary); opacity: 0.1; }
  .line-dot { fill: var(--primary); stroke: var(--card); stroke-width: 2; cursor: pointer; }
  .kh-line { stroke: var(--ribbon-gold-text, var(--foreground)); stroke-width: 1.5; stroke-dasharray: 5,4; }
</style>
</head>
<body>
<style>
  main.dashboard, .dashboard-row, .col, .tab-panel, .stat-row, .folder-content { gap: 12px; }
  .object.kpi-card { min-height: 150px; display: grid; place-items: center; }
  .object.chart-card { min-height: 360px; display: flex; flex-direction: column; }
  .object-full { margin-top: 0; }
  .folder-content { display: flex; flex-direction: column; }
  .folder-panel { margin-top: -13px; }
  .folder-content[hidden], .tab-panel[hidden] { display: none !important; }
  .object-mount { flex: 1; min-height: 0; display: grid; place-items: center; }
  .item-label {
    color: var(--muted-foreground);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.4px;
  }
  /* CHART DEFAULT 1: Use the original BIDV demo teal first, then yellow and grey for dashboard data series. */
  .chart-series-teal { fill: var(--chart-teal); background: var(--chart-teal); }
  .chart-series-yellow { fill: var(--chart-yellow); background: var(--chart-yellow); }
  .chart-series-grey { fill: var(--chart-grey); background: var(--chart-grey); }
  /* CHART DEFAULT 2: Give every bar/column rounded corners. Add class="chart-column" and explicit rx="6" ry="6" to SVG rects; clip a whole stacked column to one rounded outer rect so internal joins stay flat. */
  svg .chart-column { rx: var(--chart-column-radius); ry: var(--chart-column-radius); }
  .target-met-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .target-met-chart { flex: 1; min-height: 270px; }
  .target-met-chart svg { width: 100%; height: 100%; display: block; }
  .target-met-view .legend { margin-top: 6px; }
  @media (max-width: 720px) {
    body { padding: 10px; }
    header.topbar { align-items: flex-start; padding: 16px; }
    header.topbar .brand { font-size: 17px; }
    .tab-bar { overflow-x: auto; padding: 0 8px; }
    .tab-btn { white-space: nowrap; padding-inline: 12px; }
    .folder-tabs { overflow-x: auto; }
    .folder-tab { white-space: nowrap; padding-inline: 14px; }
  }
</style>

<script>
  window.dashboardChartDefaults = Object.freeze({
    series: Object.freeze([
      Object.freeze({ name: "teal", cssVariable: "--chart-teal", color: "#0d5d56" }),
      Object.freeze({ name: "yellow", cssVariable: "--chart-yellow", color: "#ffc72c" }),
      Object.freeze({ name: "grey", cssVariable: "--chart-grey", color: "#a8a6a0" })
    ]),
    columnRadius: 6
  });

  function chartObject(tabNumber, objectNumber, chartNumber, fullWidth = false) {
    const name = `tab-${tabNumber}-object-${objectNumber}-chart-${chartNumber}`;
    const itemNumber = 7 + ((tabNumber - 1) * 12) + ((objectNumber - 1) * 3) + chartNumber;
    const card = `
      <section class="card chart-card object${fullWidth ? " object-full" : ""}"
        data-object="${name}" data-item="item-${itemNumber}" aria-label="Item ${itemNumber}: visualization slot ${name}">
        <div class="object-mount"><span class="item-label">Item ${itemNumber}</span></div>
      </section>`;
    return fullWidth ? card : `<div class="col">${card}</div>`;
  }

  function objectPanel(tabNumber, objectNumber) {
    return `
      <section class="folder-content" data-folder-panel="${objectNumber}"${objectNumber === 1 ? "" : " hidden"}>
        <div class="dashboard-row">
          ${chartObject(tabNumber, objectNumber, 1)}
          ${chartObject(tabNumber, objectNumber, 2)}
        </div>
        ${chartObject(tabNumber, objectNumber, 3, true)}
      </section>`;
  }

  document.querySelectorAll(".detail-tab").forEach((tab) => {
    const tabNumber = Number(tab.dataset.tabNumber);
    tab.innerHTML = `
      <div class="folder-tabs" role="tablist" aria-label="Tab ${tabNumber} buttons">
        ${[1, 2, 3, 4].map((number) => `
          <button class="folder-tab${number === 1 ? " active" : ""}" type="button"
            data-folder="${number}" role="tab" aria-selected="${number === 1}">Button ${number}</button>
        `).join("")}
      </div>
      <div class="folder-panel">
        ${[1, 2, 3, 4].map((number) => objectPanel(tabNumber, number)).join("")}
      </div>`;

    const folderButtons = [...tab.querySelectorAll("[data-folder]")];
    const folderPanels = [...tab.querySelectorAll("[data-folder-panel]")];
    folderButtons.forEach((button) => {
      button.addEventListener("click", () => {
        folderButtons.forEach((item) => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.setAttribute("aria-selected", String(active));
        });
        folderPanels.forEach((panel) => {
          panel.hidden = panel.dataset.folderPanel !== button.dataset.folder;
        });
      });
    });
  });

  const tabButtons = [...document.querySelectorAll(".tab-btn")];
  const tabPanels = [...document.querySelectorAll("[data-tab-panel]")];
  tabButtons.forEach((button) => {
    button.addEventListener("click", () => {
      tabButtons.forEach((item) => item.classList.toggle("active", item === button));
      tabPanels.forEach((panel) => {
        panel.hidden = panel.dataset.tabPanel !== button.dataset.tab;
      });
    });
  });

  window.dashboardObjects = Object.fromEntries(
    [...document.querySelectorAll("[data-object]")].map((element) => [element.dataset.object, element])
  );
  window.getDashboardObject = (name) => window.dashboardObjects[name] || null;
  window.dashboardItems = Object.fromEntries(
    [...document.querySelectorAll("[data-item]")].map((element) => [element.dataset.item, element])
  );
  window.getDashboardItem = (number) => window.dashboardItems[`item-${Number(number)}`] || null;

  function escapeChartText(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&apos;");
  }

  function wrapChartLabel(value, maxChars = 16) {
    const words = String(value ?? "").trim().split(/\s+/).filter(Boolean);
    const lines = [];
    let current = "";
    words.forEach((word) => {
      if (current && `${current} ${word}`.length > maxChars) {
        lines.push(current);
        current = word;
      } else {
        current = current ? `${current} ${word}` : word;
      }
    });
    if (current) lines.push(current);
    return (lines.length ? lines : [""]).slice(0, 3);
  }

  function targetMetAxisMaximum(maxValue) {
    if (maxValue >= 1000) return Math.ceil((maxValue * 1.1) / 500) * 500;
    const raw = Math.max(maxValue * 1.1, 1);
    const magnitude = 10 ** Math.floor(Math.log10(raw));
    const normalized = raw / magnitude;
    const nice = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
    return nice * magnitude;
  }

  /**
   * Render the demo's target-met stacked columns in any numbered dashboard item.
   * Example: renderTargetMetChart(6, { title: "Các chỉ tiêu KHKD khác",
   *   items: [{ label: "Item 1", actual: 3465, target: 6100 }] });
   */
  window.renderTargetMetChart = (itemNumber, config = {}) => {
    const host = window.getDashboardItem(itemNumber);
    if (!host) throw new Error(`Dashboard Item ${itemNumber} does not exist.`);
    if (!host.classList.contains("chart-card")) {
      throw new Error(`Dashboard Item ${itemNumber} is not a chart slot.`);
    }

    const items = (Array.isArray(config.items) ? config.items : []).map((item, index) => ({
      label: String(item.label ?? item.name ?? `Item ${index + 1}`),
      actual: Math.max(0, Number(item.actual) || 0),
      target: Math.max(0, Number(item.target) || 0)
    }));
    if (!items.length) throw new Error("renderTargetMetChart requires at least one item.");

    const title = String(config.title ?? "Các chỉ tiêu KHKD khác");
    const actualLabel = String(config.actualLabel ?? "KQKD");
    const targetLabel = String(config.targetLabel ?? "KH");
    const unit = String(config.unit ?? "");
    const chartId = `target-met-${Number(itemNumber)}-${Math.random().toString(36).slice(2, 8)}`;

    host.querySelector(".item-label")?.remove();
    host.innerHTML = `
      <div class="chart-card-head"><h3>${escapeChartText(title)}</h3></div>
      <div class="target-met-view">
        <div class="target-met-chart" id="${chartId}" role="img" aria-label="${escapeChartText(title)}"></div>
        <div class="legend" aria-label="Chart legend">
          <span class="item"><i class="swatch" style="background:var(--chart-teal)"></i>${escapeChartText(actualLabel)}</span>
          <span class="item"><i class="swatch" style="background:color-mix(in srgb, var(--chart-teal) 50%, transparent)"></i>Vượt ${escapeChartText(targetLabel)}</span>
          <span class="item"><i class="swatch" style="background:var(--muted)"></i>Còn lại so với ${escapeChartText(targetLabel)}</span>
        </div>
      </div>`;

    const chartHost = host.querySelector(`#${chartId}`);
    const formatValue = (value) => new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 1 }).format(value);
    const formatTick = (value) => value >= 1000
      ? `${(value / 1000).toFixed(1).replace(".0", "")}K`
      : formatValue(value);

    const draw = () => {
      const W = Math.max(420, Math.round(chartHost.clientWidth || 900));
      const H = Math.max(260, Math.round(chartHost.clientHeight || 300));
      // Keep a dedicated right-side gutter so every KH label can sit beside its column.
      const padL = 46, padR = 64, padT = 28, padB = 66;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const colW = plotW / items.length;
      const barW = Math.max(18, Math.min(72, colW * 0.55));
      const maxValue = Math.max(...items.flatMap((item) => [item.actual, item.target]), 1);
      const yMax = targetMetAxisMaximum(maxValue);
      const baselineY = padT + plotH;
      const yFor = (value) => baselineY - (value / yMax) * plotH;
      const ticks = [0, yMax * 0.25, yMax * 0.5, yMax * 0.75, yMax];

      const grid = ticks.map((value) => {
        const y = yFor(value);
        return `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" />
          <text class="axis-label" x="${padL - 7}" y="${y + 4}" text-anchor="end">${escapeChartText(formatTick(value))}</text>`;
      }).join("");

      const definitions = [];
      const bars = items.map((item, index) => {
        const x = padL + index * colW + (colW - barW) / 2;
        const stackTopValue = Math.max(item.actual, item.target);
        const stackTopY = yFor(stackTopValue);
        const stackHeight = Math.max(1, baselineY - stackTopY);
        const actualBoundaryY = yFor(Math.min(item.actual, item.target));
        const clipId = `${chartId}-clip-${index}`;
        definitions.push(`<clipPath id="${clipId}"><rect class="chart-column" x="${x}" y="${stackTopY}" width="${barW}" height="${stackHeight}" rx="6" ry="6" /></clipPath>`);

        let segments = "";
        let labels = "";
        if (item.actual < item.target) {
          const actualY = yFor(item.actual);
          segments = `<g clip-path="url(#${clipId})">
              <rect x="${x}" y="${actualY}" width="${barW}" height="${Math.max(1, baselineY - actualY)}" fill="var(--chart-teal)" />
              <rect x="${x}" y="${stackTopY}" width="${barW}" height="${Math.max(1, actualY - stackTopY)}" fill="var(--muted)" />
              <rect x="${x}" y="${actualY - 2}" width="${barW}" height="2" fill="var(--card)" />
            </g>`;
          labels = `<text class="axis-label target-label" x="${x + barW + 7}" y="${stackTopY + 4}" text-anchor="start">${escapeChartText(targetLabel)} ${escapeChartText(formatValue(item.target))}</text>
            <text class="bar-label" x="${x + barW / 2}" y="${actualY - 5}" text-anchor="middle">${escapeChartText(formatValue(item.actual))}</text>`;
        } else if (item.actual > item.target) {
          const targetY = yFor(item.target);
          segments = `<g clip-path="url(#${clipId})">
              <rect x="${x}" y="${targetY}" width="${barW}" height="${Math.max(1, baselineY - targetY)}" fill="var(--chart-teal)" />
              <rect x="${x}" y="${stackTopY}" width="${barW}" height="${Math.max(1, targetY - stackTopY)}" fill="var(--chart-teal)" opacity="0.5" />
              <rect x="${x}" y="${targetY - 2}" width="${barW}" height="2" fill="var(--card)" />
            </g>
            <line x1="${x - 3}" x2="${x + barW + 3}" y1="${targetY}" y2="${targetY}" stroke="var(--foreground)" stroke-width="1" stroke-dasharray="2,2" />`;
          labels = `<text class="axis-label target-label" x="${x + barW + 7}" y="${targetY + 4}" text-anchor="start">${escapeChartText(targetLabel)} ${escapeChartText(formatValue(item.target))}</text>
            <text class="bar-label" x="${x + barW / 2}" y="${stackTopY - 5}" text-anchor="middle">${escapeChartText(formatValue(item.actual))}</text>`;
        } else {
          segments = `<g clip-path="url(#${clipId})"><rect x="${x}" y="${stackTopY}" width="${barW}" height="${stackHeight}" fill="var(--chart-teal)" /></g>`;
          labels = `<text class="axis-label target-label" x="${x + barW + 7}" y="${stackTopY + 4}" text-anchor="start">${escapeChartText(targetLabel)} ${escapeChartText(formatValue(item.target))}</text>
            <text class="bar-label" x="${x + barW / 2}" y="${stackTopY - 5}" text-anchor="middle">${escapeChartText(formatValue(item.actual))}</text>`;
        }

        const labelLines = wrapChartLabel(item.label, items.length > 8 ? 12 : 16).map((line, lineIndex) =>
          `<text class="axis-label" x="${x + barW / 2}" y="${baselineY + 17 + lineIndex * 13}" text-anchor="middle">${escapeChartText(line)}</text>`
        ).join("");
        const tooltip = `${item.label}\n${actualLabel}: ${formatValue(item.actual)}${unit ? ` ${unit}` : ""}\n${targetLabel}: ${formatValue(item.target)}${unit ? ` ${unit}` : ""}`;
        return `<g class="bar target-met-bar" data-index="${index}" tabindex="0">${segments}${labels}<title>${escapeChartText(tooltip)}</title></g>${labelLines}`;
      }).join("");

      chartHost.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>${definitions.join("")}</defs>
        ${grid}
        <line class="baseline" x1="${padL}" x2="${W - padR}" y1="${baselineY}" y2="${baselineY}" />
        ${bars}
      </svg>`;
    };

    host._targetMetChartObserver?.disconnect();
    host._targetMetChartObserver = new ResizeObserver(draw);
    host._targetMetChartObserver.observe(chartHost);
    draw();
    return host;
  };
</script>

</body>
</html>
